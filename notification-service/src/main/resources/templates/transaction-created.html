<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; color: #333; margin: 0; }
        .container { max-width: 600px; margin: 40px auto; padding: 24px; }
        .header { background: #3b82f6; color: white; padding: 20px 24px; border-radius: 8px 8px 0 0; }
        .body { background: #f9f9f9; padding: 24px; border: 1px solid #eee; }
        .tx-box { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 16px; }
        .amount { font-size: 28px; font-weight: bold; color: #3b82f6; }
        .label { font-size: 12px; color: #666; margin-bottom: 4px; }
        .footer { padding: 16px; font-size: 12px; color: #999; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Transaction Recorded</h1>
    </div>
    <div class="body">
        <p>A new transaction has been recorded on your account.</p>
        <div class="tx-box">
            <div class="label">Amount</div>
            <div class="amount"
                 th:text="${currency + ' ' + amount}">USD 45.00</div>
            <br>
            <div class="label">Category</div>
            <div th:text="${category}">FOOD</div>
            <br>
            <div class="label">Merchant</div>
            <div th:text="${merchant ?: 'Not specified'}">Coffee Shop</div>
            <br>
            <div class="label">Date</div>
            <div th:text="${transactionDate}">2025-08-12</div>
        </div>
        <p style="margin-top:16px">If you did not make this transaction, please contact support immediately.</p>
    </div>
    <div class="footer">FinSight — Personal Finance Intelligence</div>
</div>
</body>
</html>
