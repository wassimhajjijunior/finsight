spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      # Spring Cloud Gateway 5.x nests webflux routes under server.webflux.
      server:
        webflux:
          routes:
            - id: auth-route
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: account-route
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**
              filters:
                - StripPrefix=1
            - id: transaction-route
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**
              filters:
                - StripPrefix=1
            - id: budget-route
              uri: lb://budget-service
              predicates:
                - Path=/api/budgets/**
              filters:
                - StripPrefix=1
            - id: ai-route
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus

# Dev-only fallback. In Compose the JWT_SECRET environment variable overrides it.
jwt:
  secret: ${JWT_SECRET:your-very-long-secret-key-minimum-256-bits-change-this-in-production}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
