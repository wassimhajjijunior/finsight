server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/wassimhajjijunior/finsight-config.git
          default-label: main
          clone-on-start: true
          force-pull: true
          search-paths: '.'

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false