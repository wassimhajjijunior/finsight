spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/auth_db
    username: ${DB_USER:auth_user}
    password: ${DB_PASSWORD:auth_pass}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  port: ${SERVER_PORT:18081}

jwt:
  secret: local-dev-secret-key-minimum-32-characters-long-change-in-prod
  expiration: 86400000
  refresh-expiration: 604800000