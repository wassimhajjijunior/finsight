spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/auth_db
    username: ${DB_USER:auth_user}
    password: ${DB_PASSWORD:auth_pass}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  port: ${SERVER_PORT:18082}

jwt:
  secret: your-very-long-secret-key-minimum-256-bits-change-this-in-production
  expiration: 86400000
  refresh-expiration: 604800000