spring:
  application:
    name: auth-service
  config:
    import:
      - optional:configserver:http://localhost:8888
      # imported later = higher precedence -> local localhost settings win
      # optional: the Docker image never ships local-overrides.yml (local credentials)
      - optional:classpath:local-overrides.yml
  cloud:
    config:
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 6
      fail-fast: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  # No default: required at runtime when local-overrides.yml is absent (the Docker image never ships it)
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000
